# Docker Compose configuration — orchestrates the backend API, Redis, and database services.
# Local development only. Production uses Railway for the backend
# (with Supabase Postgres and Redis via Upstash).
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    volumes: ["./backend:/app"]
    depends_on: [postgres, redis]

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: volterra
      POSTGRES_PASSWORD: volterra
      POSTGRES_DB: volterraai
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  postgres_data:
